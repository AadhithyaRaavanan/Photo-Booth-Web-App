<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="240" height="240">
    <defs>
      <!-- Deep Imperial Ruby / Crimson Velvet Gradient (Never blends with frame!) -->
      <radialGradient id="rubyVelvetGrad" cx="50%" cy="45%" r="65%">
        <stop offset="0%" stop-color="#a80d3d" />
        <stop offset="45%" stop-color="#7a0528" />
        <stop offset="85%" stop-color="#420214" />
        <stop offset="100%" stop-color="#26010b" />
      </radialGradient>

      <!-- 24-Karat Gleaming Gold Bezel Border -->
      <linearGradient id="goldBezelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fffde7" />
        <stop offset="25%" stop-color="#ffd54f" />
        <stop offset="60%" stop-color="#ffb300" />
        <stop offset="85%" stop-color="#ff8f00" />
        <stop offset="100%" stop-color="#ffd54f" />
      </linearGradient>

      <!-- Inner Gold Shimmer -->
      <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="35%" stop-color="#fff176" />
        <stop offset="75%" stop-color="#ffd54f" />
        <stop offset="100%" stop-color="#ffb300" />
      </linearGradient>

      <filter id="sealLuxeShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.9" />
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffd700" flood-opacity="0.5" />
      </filter>
    </defs>

    <g filter="url(#sealLuxeShadow)">
      <!-- 1. Deep Royal Ruby Cartouche Body -->
      <path
        d="M 100 12 C 110 23, 120 27, 130 27 C 148 27, 164 43, 164 61 C 164 71, 174 81, 188 100 C 174 119, 164 129, 164 139 C 164 157, 148 173, 130 173 C 120 173, 110 177, 100 188 C 90 177, 80 173, 70 173 C 52 173, 36 157, 36 139 C 36 129, 26 119, 12 100 C 26 81, 36 71, 36 61 C 36 43, 52 27, 70 27 C 80 27, 90 23, 100 12 Z"
        fill="url(#rubyVelvetGrad)"
        stroke="url(#goldBezelBorder)"
        stroke-width="4.5"
        stroke-linejoin="round"
      />

      <!-- 2. Concentric Gold Inset Line -->
      <path
        d="M 100 12 C 110 23, 120 27, 130 27 C 148 27, 164 43, 164 61 C 164 71, 174 81, 188 100 C 174 119, 164 129, 164 139 C 164 157, 148 173, 130 173 C 120 173, 110 177, 100 188 C 90 177, 80 173, 70 173 C 52 173, 36 157, 36 139 C 36 129, 26 119, 12 100 C 26 81, 36 71, 36 61 C 36 43, 52 27, 70 27 C 80 27, 90 23, 100 12 Z"
        transform="translate(100, 100) scale(0.92) translate(-100, -100)"
        fill="none"
        stroke="#ffd54f"
        stroke-width="1.2"
        opacity="0.8"
      />

      <!-- 3. Auspicious 24K Golden Beaded Chain Ring -->
      <path
        d="M 100 12 C 110 23, 120 27, 130 27 C 148 27, 164 43, 164 61 C 164 71, 174 81, 188 100 C 174 119, 164 129, 164 139 C 164 157, 148 173, 130 173 C 120 173, 110 177, 100 188 C 90 177, 80 173, 70 173 C 52 173, 36 157, 36 139 C 36 129, 26 119, 12 100 C 26 81, 36 71, 36 61 C 36 43, 52 27, 70 27 C 80 27, 90 23, 100 12 Z"
        transform="translate(100, 100) scale(0.85) translate(-100, -100)"
        fill="none"
        stroke="#ffd54f"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-dasharray="0.1 7.2"
      />

      <!-- 4. Inner Fine Golden Trim -->
      <path
        d="M 100 12 C 110 23, 120 27, 130 27 C 148 27, 164 43, 164 61 C 164 71, 174 81, 188 100 C 174 119, 164 129, 164 139 C 164 157, 148 173, 130 173 C 120 173, 110 177, 100 188 C 90 177, 80 173, 70 173 C 52 173, 36 157, 36 139 C 36 129, 26 119, 12 100 C 26 81, 36 71, 36 61 C 36 43, 52 27, 70 27 C 80 27, 90 23, 100 12 Z"
        transform="translate(100, 100) scale(0.77) translate(-100, -100)"
        fill="none"
        stroke="#ffb300"
        stroke-width="0.8"
        opacity="0.6"
      />

      <!-- 5. Large, High-Impact 30% Icon Typography -->
      <!-- Top: DIWALI OFFER -->
      <text
        x="100"
        y="58"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-weight="900"
        font-size="11.5"
        letter-spacing="2"
        fill="#ffe082"
      >
        DIWALI OFFER
      </text>

      <!-- Decorative Divider with Diamond -->
      <line x1="56" y1="65" x2="144" y2="65" stroke="#ffd54f" stroke-width="1.4" stroke-linecap="round" opacity="0.85" />
      <polygon points="100,62 103,65 100,68 97,65" fill="#ffd54f" />

      <!-- Center Hero: 30% IN HUGE BOLD GOLD -->
      <text
        x="100"
        y="112"
        text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', serif"
        font-weight="900"
        font-size="44"
        letter-spacing="1"
        fill="url(#goldTextGrad)"
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))"
      >
        30%
      </text>

      <!-- Divider with Diamond -->
      <line x1="60" y1="123" x2="140" y2="123" stroke="#ffd54f" stroke-width="1.4" stroke-linecap="round" opacity="0.85" />
      <polygon points="100,120 103,123 100,126 97,123" fill="#ffd54f" />

      <!-- Bottom: OFF in Crisp Gold/White -->
      <text
        x="100"
        y="142"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-weight="900"
        font-size="16"
        letter-spacing="4"
        fill="#ffffff"
      >
        OFF
      </text>
    </g>
  </svg>