<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="300" height="300">
    <defs>
      <!-- Rich Festive Saffron Gold Gradient -->
      <linearGradient id="sealGoldSurface" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff176" />
        <stop offset="25%" stop-color="#ffca28" />
        <stop offset="65%" stop-color="#ffb300" />
        <stop offset="100%" stop-color="#ffa000" />
      </linearGradient>

      <!-- Royal Metallic Gold Border Gradient -->
      <linearGradient id="sealGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fffde7" />
        <stop offset="35%" stop-color="#ffd54f" />
        <stop offset="70%" stop-color="#ff8f00" />
        <stop offset="100%" stop-color="#b26a00" />
      </linearGradient>

      <!-- Soft Luxury Shadow -->
      <filter id="royalSealGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffd54f" flood-opacity="0.5" />
      </filter>
    </defs>

    <g filter="url(#royalSealGlow)">
      <!-- 1. Outer Cartouche Body with Gold Sheen -->
      <path
        d="M 100 14 C 108 24, 118 28, 128 28 C 146 28, 162 44, 162 62 C 162 72, 172 82, 186 100 C 172 118, 162 128, 162 138 C 162 156, 146 172, 128 172 C 118 172, 108 176, 100 186 C 92 176, 82 172, 72 172 C 54 172, 38 156, 38 138 C 38 128, 28 118, 14 100 C 28 82, 38 72, 38 62 C 38 44, 54 28, 72 28 C 82 28, 92 24, 100 14 Z"
        fill="url(#sealGoldSurface)"
        stroke="url(#sealGoldBorder)"
        stroke-width="4"
        stroke-linejoin="round"
      />

      <!-- 2. Concentric Inner Border Line -->
      <path
        d="M 100 14 C 108 24, 118 28, 128 28 C 146 28, 162 44, 162 62 C 162 72, 172 82, 186 100 C 172 118, 162 128, 162 138 C 162 156, 146 172, 128 172 C 118 172, 108 176, 100 186 C 92 176, 82 172, 72 172 C 54 172, 38 156, 38 138 C 38 128, 28 118, 14 100 C 28 82, 38 72, 38 62 C 38 44, 54 28, 72 28 C 82 28, 92 24, 100 14 Z"
        transform="translate(100, 100) scale(0.92) translate(-100, -100)"
        fill="none"
        stroke="#330419"
        stroke-width="1.2"
        opacity="0.65"
      />

      <!-- 3. Traditional Auspicious Dotted Beaded Chain Ring -->
      <path
        d="M 100 14 C 108 24, 118 28, 128 28 C 146 28, 162 44, 162 62 C 162 72, 172 82, 186 100 C 172 118, 162 128, 162 138 C 162 156, 146 172, 128 172 C 118 172, 108 176, 100 186 C 92 176, 82 172, 72 172 C 54 172, 38 156, 38 138 C 38 128, 28 118, 14 100 C 28 82, 38 72, 38 62 C 38 44, 54 28, 72 28 C 82 28, 92 24, 100 14 Z"
        transform="translate(100, 100) scale(0.85) translate(-100, -100)"
        fill="none"
        stroke="#330419"
        stroke-width="3"
        stroke-linecap="round"
        stroke-dasharray="0.1 7"
      />

      <!-- 4. Inner Fine Golden Trim -->
      <path
        d="M 100 14 C 108 24, 118 28, 128 28 C 146 28, 162 44, 162 62 C 162 72, 172 82, 186 100 C 172 118, 162 128, 162 138 C 162 156, 146 172, 128 172 C 118 172, 108 176, 100 186 C 92 176, 82 172, 72 172 C 54 172, 38 156, 38 138 C 38 128, 28 118, 14 100 C 28 82, 38 72, 38 62 C 38 44, 54 28, 72 28 C 82 28, 92 24, 100 14 Z"
        transform="translate(100, 100) scale(0.78) translate(-100, -100)"
        fill="none"
        stroke="#fff59d"
        stroke-width="1"
        opacity="0.75"
      />

      <!-- 5. Content Layout (Matching reference image precisely) -->
      <!-- Top Line: DISCOUNT (e.g. 30% OFF) -->
      <text
        x="100"
        y="68"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-weight="900"
        font-size="15"
        letter-spacing="1.5"
        fill="#260212"
      >
        30% OFF
      </text>

      <!-- Horizontal Divider Line with Center Diamond -->
      <line x1="56" y1="76" x2="144" y2="76" stroke="#260212" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="100,72.5 103.5,76 100,79.5 96.5,76" fill="#260212" />

      <!-- Center Big Royal Typography: DIWALI with stylized A curl flourish -->
      <g>
        <text
          x="100"
          y="112"
          text-anchor="middle"
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif"
          font-weight="900"
          font-size="32"
          letter-spacing="2.5"
          fill="#260212"
        >
          DIWALI
        </text>
        <!-- Little decorative flame swirl accent above the A -->
        <circle cx="98" cy="91" r="2.2" fill="#260212" />
        <path d="M 98 90 Q 102 85 100 82 Q 95 86 98 90 Z" fill="#260212" />
      </g>

      <!-- Bottom Horizontal Divider Line with Center Diamond -->
      <line x1="56" y1="122" x2="144" y2="122" stroke="#260212" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="100,118.5 103.5,122 100,125.5 96.5,122" fill="#260212" />

      <!-- Bottom Line: OFFER -->
      <text
        x="100"
        y="141"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-weight="900"
        font-size="14.5"
        letter-spacing="3.5"
        fill="#260212"
      >
        OFFER
      </text>
    </g>
  </svg>